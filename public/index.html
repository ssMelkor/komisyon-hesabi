<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taksit Komisyon Hesaplayıcı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white font-bold">
          ₺
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-tight">Taksit Komisyon Hesaplayıcı</h1>
          <p class="text-xs text-slate-400">Ekstra Taksit & Komisyon Analizi</p>
        </div>
      </div>
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
        Excel Uyumlu Formüller
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    
    <!-- Giriş ve Seçim Paneli -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl mb-6 backdrop-blur-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
        
        <!-- Ürün Türü Seçimi -->
        <div class="md:col-span-6">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Ürün Türü</label>
          <div class="grid grid-cols-2 p-1 bg-slate-950 rounded-xl border border-slate-800">
            <button id="btn-phone" onclick="setType('phone')" class="py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center space-x-2 bg-blue-600 text-white shadow">
              <span>📱</span>
              <span>Telefon</span>
            </button>
            <button id="btn-normal" onclick="setType('normal')" class="py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center space-x-2 text-slate-400 hover:text-white">
              <span>📦</span>
              <span>Normal Ürün</span>
            </button>
          </div>
        </div>

        <!-- Tutar Girişi -->
        <div class="md:col-span-6">
          <label for="priceInput" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Peşin / Baz Fiyat (₺)</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 font-bold text-lg">₺</div>
            <input type="number" id="priceInput" value="10000" min="0" step="any" oninput="calculate()" class="block w-full pl-10 pr-12 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xl font-bold text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-xs text-slate-500 font-semibold">TRY</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Taksit Simülasyon Kartı -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl shadow-xl overflow-hidden mb-6">
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/40">
        <div>
          <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center space-x-2">
            <span>⚡</span>
            <span id="cardTitle">Telefon Ekstra Taksit Tablosu</span>
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">Taksit adedine göre toplam maliyet ve aylık taksit ödemeleri</p>
        </div>
        <span class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-mono font-bold" id="currentPriceBadge">10.000,00 ₺</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-950/80 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">
              <th class="py-3 px-6">Seçenek</th>
              <th class="py-3 px-6">Taksit</th>
              <th class="py-3 px-6 text-center">Komisyon Oranı</th>
              <th class="py-3 px-6 text-right">Toplam Tutar</th>
              <th class="py-3 px-6 text-right">Aylık Ödeme</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800/60 text-sm"></tbody>
        </table>
      </div>
    </div>

    <!-- Ekstra Bilgi / Kategori Notu -->
    <div id="infoBox" class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 text-xs text-slate-400"></div>

  </main>

  <footer class="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500">
    Taksit & Komisyon Hesaplama Aracı
  </footer>

  <script>
    let currentType = 'phone';

    // Telefon Ekstra Taksit Oranları (Excel formülleri birebir)
    const PHONE_DATA = [
      { name: 'ARTI 1', label: 'Tek Çekim', factor: 1.0000, inst: 1, rate: '%0.00' },
      { name: 'ARTI 2', label: '2 Taksit', factor: 1.0610, inst: 2, rate: '%6.10' },
      { name: 'ARTI 3', label: '3 Taksit', factor: 1.0830, inst: 3, rate: '%8.30' },
      { name: 'ARTI 4', label: '4 Taksit', factor: 1.1048, inst: 4, rate: '%10.48' },
      { name: 'ARTI 5', label: '5 Taksit', factor: 1.1300, inst: 5, rate: '%13.00' },
      { name: 'ARTI 6', label: '6 Taksit', factor: 1.1520, inst: 6, rate: '%15.20' },
      { name: 'ARTI 7', label: '7 Taksit', factor: 1.1780, inst: 7, rate: '%17.80' },
      { name: 'ARTI 8', label: '8 Taksit', factor: 1.2100, inst: 8, rate: '%21.00' }
    ];

    // Normal Ürün Ekstra Taksit Oranları (Excel formülleri birebir)
    const NORMAL_DATA = [
      { name: 'ARTI 1', label: '4 Taksit', factor: 1.02, inst: 4, rate: '%2.00' },
      { name: 'ARTI 2', label: '5 Taksit', factor: 1.04, inst: 5, rate: '%4.00' },
      { name: 'ARTI 3', label: '6 Taksit', factor: 1.06, inst: 6, rate: '%6.00' },
      { name: 'ARTI 4', label: '7 Taksit', factor: 1.08, inst: 7, rate: '%8.00' },
      { name: 'ARTI 5', label: '8 Taksit', factor: 1.10, inst: 8, rate: '%10.00' },
      { name: 'ARTI 6', label: '9 Taksit', factor: 1.12, inst: 9, rate: '%12.00' },
      { name: 'ARTI 7', label: '10 Taksit', factor: 1.14, inst: 10, rate: '%14.00' },
      { name: 'ARTI 8', label: '11 Taksit', factor: 1.16, inst: 11, rate: '%16.00' },
      { name: 'ARTI 9', label: '12 Taksit', factor: 1.18, inst: 12, rate: '%18.00' },
      { name: 'ARTI 10', label: '13 Taksit', factor: 1.20, inst: 13, rate: '%20.00' },
      { name: 'ARTI 11', label: '14 Taksit', factor: 1.22, inst: 14, rate: '%22.00' },
      { name: 'ARTI 12', label: '15 Taksit', factor: 1.24, inst: 15, rate: '%24.00' }
    ];

    function formatTRY(val) {
      return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val) + ' ₺';
    }

    function setType(type) {
      currentType = type;
      const btnPhone = document.getElementById('btn-phone');
      const btnNormal = document.getElementById('btn-normal');

      if (type === 'phone') {
        btnPhone.className = "py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center space-x-2 bg-blue-600 text-white shadow";
        btnNormal.className = "py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center space-x-2 text-slate-400 hover:text-white";
        document.getElementById('cardTitle').textContent = 'Telefon Ekstra Taksit Tablosu';
      } else {
        btnNormal.className = "py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center space-x-2 bg-blue-600 text-white shadow";
        btnPhone.className = "py-2.5 px-4 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center space-x-2 text-slate-400 hover:text-white";
        document.getElementById('cardTitle').textContent = 'Normal Ürün Ekstra Taksit Tablosu';
      }
      calculate();
    }

    function calculate() {
      const price = parseFloat(document.getElementById('priceInput').value) || 0;
      document.getElementById('currentPriceBadge').textContent = formatTRY(price);

      const dataList = currentType === 'phone' ? PHONE_DATA : NORMAL_DATA;
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      dataList.forEach(item => {
        const total = price * item.factor;
        const monthly = total / item.inst;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/40 transition-colors";
        tr.innerHTML = `
          <td class="py-3.5 px-6 font-semibold text-amber-400 font-mono">${item.name}</td>
          <td class="py-3.5 px-6 font-medium text-slate-200">${item.label}</td>
          <td class="py-3.5 px-6 text-center text-xs font-mono text-slate-400">${item.rate}</td>
          <td class="py-3.5 px-6 text-right font-mono font-bold text-white">${formatTRY(total)}</td>
          <td class="py-3.5 px-6 text-right font-mono font-semibold text-emerald-400">${formatTRY(monthly)}</td>
        `;
        tableBody.appendChild(tr);
      });

      // Bilgi Kutusu
      const infoBox = document.getElementById('infoBox');
      if (currentType === 'phone') {
        infoBox.innerHTML = `💡 <strong>Telefon Modu:</strong> Cep telefonu satışları için 1'den 8 taksite kadar olan özel komisyon oranları hesaplanmaktadır.`;
      } else {
        infoBox.innerHTML = `💡 <strong>Normal Ürün Modu:</strong> Standart perakende ürünler için 4'ten 15 taksite kadar olan ilave taksit katsayıları hesaplanmaktadır.`;
      }
    }

    // İlk yükleme
    calculate();
  </script>
</body>
</html>
